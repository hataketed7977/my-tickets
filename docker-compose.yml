services:
  api:
    build:
      context: ./services/api
    environment:
      PORT: 55888
      DATABASE_URL: "jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      WEB_BASE_URL: http://localhost:51888
      CLIENT_ORIGIN: http://localhost:51888
      COOKIE_SECURE: "false"
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://localhost:55888/api/auth/feishu/callback}
    ports:
      - "55888:55888"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:55888
    depends_on:
      - api
    ports:
      - "51888:80"
