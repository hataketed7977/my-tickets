plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bytedance'
version = '1.0.0'

// The MCP security libraries (0.0.6) require Spring Security 6.5 / SAS 1.5. Boot is
// kept at 3.4.5 (Spring Framework 6.2 is compatible with Security 6.5); only the
// security line is overridden because of a concrete runtime incompatibility.
ext['spring-security.version'] = '6.5.2'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation platform('org.springframework.ai:spring-ai-bom:1.1.0')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.5.1'
    implementation 'org.springaicommunity:mcp-authorization-server:0.0.6'
    implementation 'org.springaicommunity:mcp-server-security:0.0.6'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

// 覆盖率防退化门禁。阈值刻意低于当前实测值（LINE 74.68% / BRANCH 53.03%），
// 只拦“显著退化”，给新增样板代码/DTO/配置留出波动缓冲，避免门禁噪音化。
tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.45
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
