server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:55888}

spring:
  application:
    name: ticket-center-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  ai:
    mcp:
      server:
        name: ticket-center-mcp
        version: 1.0.0
        protocol: STATELESS
        capabilities:
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

app:
  web-base-url: ${WEB_BASE_URL:http://localhost:51888}
  client-origin: ${CLIENT_ORIGIN:http://localhost:51888}
  cookie-secure: ${COOKIE_SECURE:false}
  feishu:
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:55888/api/auth/feishu/callback}
